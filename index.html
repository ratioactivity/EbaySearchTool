<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radium Finder v4</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
<style>
  body {
    background: radial-gradient(circle at center, #022 0%, #000 100%);
    color: #b4ffbb;
    font-family: 'Orbitron', sans-serif;
    text-align: center;
    padding: 2em;
    overflow-x: hidden;
  }
  img {
    width: 100px;
    opacity: 0.8;
    filter: drop-shadow(0 0 10px #00ff88);
    animation: pulse 3s infinite alternate;
  }
  @keyframes pulse {
    from { filter: drop-shadow(0 0 6px #00ff88); }
    to { filter: drop-shadow(0 0 20px #00ffcc); }
  }
  h2 {
    color: #00ff88;
    text-shadow: 0 0 10px #00ff88;
  }
  .container {
    display: inline-block;
    background: rgba(0, 40, 0, 0.5);
    border: 1px solid #00ff88;
    border-radius: 10px;
    padding: 1.5em;
    box-shadow: 0 0 15px #00ff88aa;
  }
  input, button, select {
    margin: 6px;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #00ff88;
    background: rgba(0, 30, 0, 0.8);
    color: #b4ffbb;
    font-size: 14px;
  }
  input:focus {
    outline: none;
    box-shadow: 0 0 8px #00ff88;
  }
  button {
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover {
    background: #00ff88;
    color: #002200;
  }
  select {
    width: 260px;
    max-height: 150px;
    overflow-y: scroll;
  }
  .openAllBox {
    margin-top: 12px;
  }
</style>
</head>
<body>
  <img src="icon128.png" alt="Radium Clock Icon">
  <h2>RADIUM EBAY SEARCH</h2>
  <div class="container">
    <input id="customSearch" type="text" list="suggestions" placeholder="Search term (e.g. antique clock)" size="35">
    <datalist id="suggestions"></datalist>
    <br>
    <button onclick="searchEbay()">Go</button>
    <button onclick="searchMultiple()">Multi</button>
    <button onclick="randomSearch()">Random</button>
    <br><br>
    <select id="presetSearches" multiple size="8"></select>
    <div class="openAllBox">
      <label for="categorySelect">Open all related to: </label>
      <select id="categorySelect">
        <option value="">-- choose --</option>
        <option value="antique">Antique</option>
        <option value="vintage">Vintage</option>
        <option value="clock">Clock</option>
        <option value="watch">Watch</option>
        <option value="pocket watch">Pocket Watch</option>
        <option value="luminous">Luminous</option>
      </select>
      <button onclick="openCategory()">Open All</button>
    </div>
  </div>

<script>
/* base with date/mechanical filters (used for single/multi/random) */
function buildEbayURL(term) {
  const filters =
    "&Time%2520Period%2520Manufactured=1900%252D1919%7C1920%252D1949%7C1950%252D1959%7C1960%252D1969%7C1970%252D1979&Movement=Mechanical%7CAutomatic%2520Mechanical%7C!&Antique=Yes";
  const base =
    "https://www.ebay.com/sch/i.html?_dcat=261602&_fsrp=1&rt=nc&_from=R40&_sacat=0&_sop=15&_nkw=";
  return base + encodeURIComponent(term.trim().replace(/\s+/g, "+")) + filters;
}

/* plain search (no filters) */
function buildPlainURL(term) {
  return (
    "https://www.ebay.com/sch/i.html?_nkw=" +
    encodeURIComponent(term.trim().replace(/\s+/g, "+"))
  );
}

const presetTerms = [
  "antique clock","vintage clock","antique timer","vintage timer",
"antique desk clock","antique mantel clock","darkroom timer","darkroom clock",
"antique baby ben","antique big ben","antique pocket ben",
"antique general electric clock","antique telechron",
"antique westclox","vintage westclox","antique seth thomas","vintage seth thomas",
"antique aircraft instruments","antique auto clock","vintage auto clock","8 day clock",
"military clock","WW2 clock","antique submarine clock",
"civil defense","antique watch","vintage watch","antique mechanical watches",
"antique pocket watch","vintage pocket watch",
"military watch","military pocket watch","WW2 watch","USSR watch",
"antique soviet watch","swiss military watch","Bulova watch",
"Bulova watch hands","military watch hands","radiolite","glo-ben","BESTFIT hands",
"antique watch lot","vintage watch lot","antique pocket watch lot","vintage pocket watch lot",
"antique stopwatch","vintage stopwatch",
"luminous","luminous clocks","luminous watch","luminous dials",
"vintage luminous","antique luminous","watch-dial painting",
"antique gauge","vintage gauge",
"military gauge","WW2 gauge","military aviation instrument",
"military aeronautical instrument","military maritime instrument",
"antique aeronautical instruments","antique maritime instruments",
"antique submarine gauge","antique submarine dial",
"antique anti-aircraft dial","antique anti-submarine dial",
"military aviation dial","antique engine meter","antique pressure gauge",
"antique compass","lensatic compass","antique flight compass","Gilbert U-238 Atomic Energy Laboratory",
"bendix dosimeter","bendix aircraft","hamilton standard aircraft",
"radium","rad","radioactive","radioactive demonstration kit","geiger source",
"scintillation","nuclear","tritium","polonium","plutonium","uranium","uranium glass",
"vaseline glass","fiestaware","revigator","undark","marvelite","radium ephemera",
"radium quack medicine","radium cigarettes","tho-radia","united states radium corporation",
"radium dial company","biltmore pocket watch","radiography history","radioactive history",
"antique clock lot","vintage clock lot",
"antique watch lot","vintage watch lot",
"antique pocket watch lot","vintage pocket watch lot",
];

const select = document.getElementById("presetSearches");
const datalist = document.getElementById("suggestions");

/* populate lists */
presetTerms.forEach((term) => {
  const opt1 = document.createElement("option");
  opt1.value = term;
  datalist.appendChild(opt1);

  const opt2 = document.createElement("option");
  opt2.textContent = term;
  select.appendChild(opt2);
});

/* ✅ double-click opens immediately */
select.addEventListener("dblclick", (e) => {
  const term = e.target.value || e.target.textContent;
  if (term) window.open(buildEbayURL(term), "_blank");
});

/* buttons */
function searchEbay() {
  const input = document.getElementById("customSearch").value.trim();
  if (input) window.open(buildEbayURL(input), "_blank");
}
function searchMultiple() {
  const selected = Array.from(select.selectedOptions).map((o) => o.value);
  if (!selected.length) return alert("Select at least one search term!");
  selected.forEach((term) => window.open(buildEbayURL(term), "_blank"));
}
function randomSearch() {
  const randomTerm =
    presetTerms[Math.floor(Math.random() * presetTerms.length)];
  window.open(buildEbayURL(randomTerm), "_blank");
}

/* ✅ open-all: plain keyword version */
function openCategory() {
  const category = document.getElementById("categorySelect").value.toLowerCase();
  if (!category) return alert("Pick a category first!");
  const matches = presetTerms.filter((t) => t.toLowerCase().includes(category));
  if (!matches.length) return alert("No matches found!");
  matches.forEach((term) => window.open(buildPlainURL(term), "_blank"));
}
</script>
</body>
</html>
